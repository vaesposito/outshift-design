<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Outshift Design — Cognitive Frameworks</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script>
(function(){var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t)}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark')}})();
</script>
<style type="text/css">
html { scroll-behavior: smooth; }

:root {
    font-family: Inter, sans-serif;
    font-feature-settings: 'liga' 1, 'calt' 1;    --fancy-transition: 0.25s cubic-bezier(0.78, 0, 0.22, 1);

    --color-bg: #fff;
    --color-text: #293247;
    --color-text-muted: #67707F;
    --color-text-subtle: #59616B;
    --color-border: rgba(41, 50, 71, 0.08);
    --color-border-medium: rgba(41, 50, 71, 0.15);
    --color-surface: rgba(255, 255, 255, 0.97);
    --color-hover: rgba(41, 50, 71, 0.04);
    --color-accent: #00BCEB;
    --color-accent-hover: #187ADC;
    --color-hamburger: #293247;
    --color-shadow: rgba(41, 50, 71, 0.08);
    --color-sdk-bg: linear-gradient(to right, rgba(210, 194, 255, 0.15), rgba(255, 255, 255, 0));
    --color-step-number: rgba(0, 188, 235, 0.08);
}
@supports (font-variation-settings: normal) {
  :root {
    font-family: InterVariable, sans-serif;
    color: var(--color-text);
  }
}

[data-theme="dark"] {
    --color-bg: #0f1117;
    --color-text: #e0e4ec;
    --color-text-muted: #9ca3b0;
    --color-text-subtle: #8a919c;
    --color-border: rgba(255, 255, 255, 0.08);
    --color-border-medium: rgba(255, 255, 255, 0.15);
    --color-surface: rgba(15, 17, 23, 0.97);
    --color-hover: rgba(255, 255, 255, 0.06);
    --color-accent: #3fc6ee;
    --color-accent-hover: #00BCEB;
    --color-hamburger: #e0e4ec;
    --color-shadow: rgba(0, 0, 0, 0.3);
    --color-sdk-bg: linear-gradient(to right, rgba(147, 69, 225, 0.1), rgba(15, 17, 23, 0));
    --color-step-number: rgba(63, 198, 238, 0.06);
}
[data-theme="dark"] .logo-light,
[data-theme="dark"] .footer-logo .logo-light { display: none; }
[data-theme="dark"] .logo-dark,
[data-theme="dark"] .footer-logo .logo-dark { display: block; }
.logo-dark,
.footer-logo .logo-dark { display: none; }
img.img-dark { display: none !important; }
[data-theme="dark"] img.img-light { display: none !important; }
[data-theme="dark"] img.img-dark { display: block !important; }

.theme-toggle {
    display: inline-flex;
    padding: 6px;
    border-radius: 8px;
    background: none;
    border: none;
    color: var(--color-text);
    cursor: pointer;
    transition: background 0.2s;
    flex-direction: row;
    z-index: 0;
}
.theme-toggle::before { content: none; }
.theme-toggle:hover { background: var(--color-hover); }
.theme-toggle .icon-sun { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

* { box-sizing: border-box; }
.container { width: 100%; padding: 0 10%; box-sizing: border-box; }
body {
    overflow-x: hidden;
    margin: 0;
    padding: 0;
    width: 100%;
    background: var(--color-bg);
    color: var(--color-text);
}

/* ── Header ── */
header {
    padding: 1% 0;
    width: 100%;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    position: relative;
    z-index: 10;
}
.design { font-size: 1.8em; font-weight: 200; margin-left: 8px; }
.logo { align-items: center; }
.logo, nav ul, header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
nav ul { list-style: none; gap: 30px; }
nav > ul > li { position: relative; }
.text, .icon { display: inline-block; vertical-align: middle; }
.icon { margin-top: 2px; }
.has-dropdown { position: relative; }
.nav-dropdown {
    position: absolute;
    top: calc(100% + 0.5rem);
    left: 0;
    z-index: 20;
    min-width: 200px;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: scaleY(0);
    transform-origin: top;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    box-shadow: 0 6px 24px var(--color-shadow);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
}
.has-dropdown.is-active > .nav-dropdown {
    opacity: 1;
    visibility: visible;
    transform: scaleY(1);
}
.nav-dropdown.nav-dropdown--research {
    left: auto;
    right: 0;
    transform-origin: top right;
}

.nav-dropdown > li {
    display: block;
    width: 100%;
}
.nav-dropdown > li > a {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 20px;
    color: var(--color-text-muted);
    font-size: 0.9em;
    white-space: nowrap;
    transition: background 0.2s;
}
.nav-dropdown > li > a:hover {
    background: var(--color-hover);
    color: var(--color-text) !important;
}
.nav-dropdown-group {
    padding: 0;
}
.nav-dropdown-label {
    display: flex;
    align-items: center;
        padding: 10px 20px;
    font-size: 0.95em;
    font-weight: 400;
    color: var(--color-text);
    text-decoration: none;
    transition: background 0.2s;
    white-space: nowrap;
}
.nav-dropdown-label:hover {
    background: var(--color-hover);
}
.nav-dropdown-sub {
    list-style: none;
    padding: 0;
    margin: 0 12px 8px 20px;
    display: flex;
    flex-direction: column;
    gap: 0;
    border-left: 2px solid var(--color-border);
}
.nav-dropdown-sub li {
    display: block;
    width: 100%;
}
.nav-dropdown-sub li a {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 16px;
    color: var(--color-text-muted);
    font-size: 0.85em;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.nav-dropdown-sub li a:hover {
    background: var(--color-hover);
    color: var(--color-text) !important;
}
.external-link-icon {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-left: 4px;
    vertical-align: middle;
    opacity: 0.5;
}
a:link, a:visited, a:hover, a:active {
    text-decoration: none;
    color: var(--color-text);
}

/* ── Blobs ── */
.blob {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: contain;
    background-repeat: no-repeat;
    opacity: 1;
}
.blob-1 {
    background-image: url('images/round-violet.svg');
    top: -10%; left: 10%;
    animation: move1 10s infinite alternate ease-in-out;
}
.blob-2 {
    background-image: url('images/round-orange.svg');
    top: 20%; right: 10%;
    animation: move2 15s infinite alternate ease-in-out;
}
.blob-3 {
    background-image: url('images/round-blue.svg');
    bottom: 10%; left: 30%;
    animation: move3 8s infinite alternate ease-in-out;
}
@keyframes move1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(20%, 50%) scale(1.1); } }
@keyframes move2 { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-30%, 30%) rotate(90deg); } }
@keyframes move3 { from { transform: translate(0, 0); } to { transform: translate(50%, -30%); } }
.blobs-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100vh;
    z-index: 0;
    pointer-events: none;
}

/* ── Page Hero ── */
.page-hero {
    position: relative;
    z-index: 1;
    padding: 24px 0 64px;
}
.page-hero .breadcrumb {
    font-size: 0.85em;
    color: var(--color-text-subtle);
    margin-bottom: 32px;
}
.page-hero .breadcrumb a {
    color: var(--color-accent);
}
.page-hero .breadcrumb span {
    margin: 0 8px;
    color: var(--color-border-medium);
}
.page-hero-title {
    text-align: center;
    margin-bottom: 32px;
}
.page-hero-title h1 {
    font-size: 2em;
    font-weight: 600;
    margin: 0;
    line-height: 1.15;
}
.page-hero-inner {
    display: flex;
    align-items: center;
    gap: 0;
}
.page-hero-text {
    flex: 5;
    padding-right: 40px;
}
.page-hero-text p {
    font-size: 18px;
    font-weight: 300;
    color: #363E4A;
    line-height: 1.7;
    margin: 0;
}
[data-theme="dark"] .page-hero-text p {
    color: var(--color-text-muted);
}
.page-hero-image {
    flex: 7;
}
.page-hero-image img {
    width: 100%;
    height: 380px;
    border-radius: 16px;
    object-fit: cover;
    display: block;
}

/* ── Pipeline Section ── */
.pipeline-section {
    position: relative;
    z-index: 1;
    padding: 80px 0;
    border: 1px solid rgba(77, 99, 128, 0.21);
    background: linear-gradient(132deg, rgba(210, 194, 255, 0.15) 26.47%, rgba(255, 255, 255, 0.00) 88.42%);
    box-shadow: 0 6.593px 10.548px 0 rgba(0, 0, 0, 0.00), 0 15.823px 52.742px 0 rgba(0, 0, 0, 0.00), 0 34.282px 105.484px 0 rgba(0, 0, 0, 0.00);
    backdrop-filter: blur(32.96px);
    -webkit-backdrop-filter: blur(32.96px);
}
.pipeline-header {
    text-align: center;
    margin-bottom: 64px;
}
.pipeline-header h2 {
    font-size: 2em;
    font-weight: 200;
    margin: 0 0 16px;
}
.pipeline-header p {
    font-size: 1.05em;
    color: var(--color-text-muted);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
}

/* ── Pipeline Steps ── */
.pipeline-steps {
    display: flex;
    flex-direction: column;
    gap: 48px;
    align-items: center;
}
.pipeline-step {
    position: relative;
    width: 100%;
    padding: 48px 0;
    border-top: 1px solid var(--color-border);
    scroll-margin-top: 96px;
}
.pipeline-step:first-child {
    border-top: none;
    padding-top: 24px;
}

/* ── Pipeline Sticky Stepper ── */
.pipeline-stepper {
    position: sticky;
    top: 16px;
    z-index: 5;
    margin: 0 auto 40px;
    max-width: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: 6px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 4px 16px var(--color-shadow);
}
.pipeline-stepper ol {
    display: flex;
    overflow-x: auto;
    gap: 4px;
    list-style: none;
    margin: 0;
    padding: 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
    justify-content: center;
}
.pipeline-stepper ol::-webkit-scrollbar { display: none; }
.pipeline-stepper li { margin: 0; flex: 0 0 auto; }
.pipeline-stepper a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    text-decoration: none;
    color: var(--color-text-muted);
    font-size: 0.85em;
    font-weight: 500;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
}
.pipeline-stepper a:hover { background: var(--color-hover); color: var(--color-text); }
.pipeline-stepper a.is-active { background: var(--color-accent); color: #fff; }
.pipeline-stepper-num {
    font-weight: 700;
    font-feature-settings: 'tnum';
    opacity: 0.95;
}
.pipeline-stepper a.is-active .pipeline-stepper-num { opacity: 1; }
.step-number {
    font-size: 5.5em;
    font-weight: 800;
    line-height: 0.85;
    margin: 0 0 -25px;
    font-feature-settings: 'tnum';
    background: linear-gradient(to bottom, #46AACE, rgba(70, 170, 206, 0));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.step-title {
    font-size: 1.4em;
    font-weight: 700;
    margin: -0.3em 0 4px;
    color: var(--color-text);
    position: relative;
}
.step-subtitle {
    font-size: 0.9em;
    font-style: italic;
    color: var(--color-text-muted);
    margin: 0 0 20px;
}
.step-desc {
    font-size: 1em;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin: 0 0 20px;
}
.step-quote {
    border: 1px solid var(--color-border-medium);
    border-radius: 10px;
    padding: 16px 20px;
    margin: 0 0 20px;
    font-size: 0.95em;
    color: var(--color-text);
    line-height: 1.6;
}
.step-list {
    padding-left: 20px;
    margin: 0 0 20px;
    color: var(--color-text);
    line-height: 1.8;
    font-size: 0.95em;
}
.step-list li {
    margin-bottom: 4px;
}
.step-list ul {
    padding-left: 20px;
    margin: 4px 0;
}
.step-deliverable {
    margin-top: 24px;
}
.step-deliverable-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.05em;
    font-weight: 700;
    color: var(--color-text);
    margin: 0 0 10px;
}
.step-deliverable-title svg {
    width: 18px;
    height: 18px;
    color: var(--color-text-muted);
}
.step-deliverable .step-list {
    margin-bottom: 0;
}

/* ── Case Studies ── */
.case-studies {
    position: relative;
    z-index: 1;
    padding: 60px 0;
}
.case-studies-header {
    text-align: center;
    margin-bottom: 48px;
}
.case-studies-header h2 {
    font-size: 2em;
    font-weight: 200;
    margin: 0 0 16px;
}
.case-studies-header p {
    font-size: 1.05em;
    color: var(--color-text-muted);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
}
.case-study-card {
    padding: 40px 48px;
    border: 1px solid rgba(77, 99, 128, 0.21);
    border-radius: 16px;
    background: linear-gradient(132deg, rgba(210, 194, 255, 0.15) 26.47%, rgba(255, 255, 255, 0.00) 88.42%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    margin-bottom: 32px;
}
.case-study-card:last-child {
    margin-bottom: 0;
}
.case-study-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 32px rgba(34, 104, 190, 0.08);
}
.case-study-label {
    font-size: 0.85em;
    color: var(--color-text-muted);
    margin: 0 0 8px;
}
.case-study-card h3 {
    font-size: 1.5em;
    font-weight: 700;
    margin: 0 0 16px;
    line-height: 1.3;
    color: var(--color-text);
}
.case-study-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}
.case-study-tags span {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.85em;
    border: 1px solid var(--color-border-medium);
    color: var(--color-text);
    background: linear-gradient(to right, rgba(210, 194, 255, 0.15) 26%, rgba(255, 255, 255, 0) 88%), rgba(255, 255, 255, 0.40);
}
[data-theme="dark"] .case-study-tags span {
    background: linear-gradient(to right, rgba(210, 194, 255, 0.15) 26%, rgba(255, 255, 255, 0) 88%), rgba(255, 255, 255, 0.06);
}
.case-study-desc {
    font-size: 1em;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin: 0 0 24px;
    max-width: 720px;
}
.case-study-problem {
    margin: 0 0 24px;
}
.case-study-problem-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.05em;
    font-weight: 600;
    color: var(--color-text);
    margin: 0 0 10px;
}
.case-study-problem-title svg {
    width: 18px;
    height: 18px;
    color: var(--color-text-muted);
}
.case-study-problem p {
    font-size: 0.95em;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin: 0;
}
.case-study-principles-label {
    font-size: 0.85em;
    color: #46AACE;
    margin: 0 0 10px;
}
.case-study-themes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.case-study-themes span {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: 500;
    border: 1px solid rgba(24, 48, 86, 0.20);
    color: var(--color-text);
    background: linear-gradient(to right, rgba(26, 193, 229, 0.12) 26%, rgba(255, 255, 255, 0) 88%), rgba(223, 241, 245, 0.60);
}
[data-theme="dark"] .case-study-themes span {
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: linear-gradient(to right, rgba(26, 193, 229, 0.12) 26%, rgba(255, 255, 255, 0) 88%), rgba(30, 60, 80, 0.40);
}

/* ── SDK Section ── */
.sdk-section {
    position: relative;
    z-index: 1;
    background: var(--color-sdk-bg);
    padding: 80px 0;
    margin-top: 40px;
}
.sdk-inner {
    display: flex;
    align-items: center;
    gap: 60px;
}
.sdk-text { flex: 1; }
.sdk-text h2 { font-size: 1.8em; font-weight: 200; margin: 0 0 20px; }
.sdk-text p {
    font-size: 1.05em;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin: 0 0 32px;
    max-width: 500px;
}
.sdk-image { flex: 1; display: flex; justify-content: flex-end; }
.sdk-image img { width: 100%; border-radius: 16px; object-fit: cover; }
button {
    position: relative;
    display: flex;
    padding: 18px 24px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border-radius: 40px;
    font-size: 1.2em;
    background: transparent;
    color: var(--color-text);
    border: none;
    cursor: pointer;
    z-index: 0;
}
button::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 40px;
    padding: 1.5px;
    background: linear-gradient(294deg, #9345E1, #187ADC, #00BCEB, #74BF4B, #F5B35C, #F09256, #EB7251);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

/* ── SDK CTA Pill ── */
.sdk-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    border-radius: 40px;
    font-size: 1em;
    font-weight: 500;
    color: var(--color-text);
    background: transparent;
    border: none;
    position: relative;
    z-index: 0;
    text-decoration: none;
    transition: transform 0.2s ease;
}
.sdk-cta::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 40px;
    padding: 1.5px;
    background: linear-gradient(294deg, #9345E1, #187ADC, #00BCEB, #74BF4B, #F5B35C, #F09256, #EB7251);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}
.sdk-cta:hover { transform: scale(1.03); }
.sdk-cta svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ── Footer ── */
footer {
    position: relative;
    z-index: 1;
    background: var(--color-bg);
    padding: 60px 0 0;
}
.footer-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 40px;
}
.footer-logo img { height: 60px; }
.footer-links h6 { font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--color-text); margin: 0 0 16px; }
.footer-links a { display: flex; align-items: center; gap: 4px; color: var(--color-text-subtle); font-size: 0.95em; margin-bottom: 10px; }
.footer-links a svg { width: 14px; height: 14px; }
.footer-links a:hover { color: var(--color-text); }
.footer-social h6 { font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--color-text); margin: 0 0 16px; }
.footer-social-icons { display: flex; gap: 10px; }
.footer-social-icons a { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--color-border); color: var(--color-text-subtle); transition: background 0.2s, color 0.2s; }
.footer-social-icons a:hover { background: var(--color-hover); color: var(--color-text); }
.footer-social-icons a svg { width: 18px; height: 18px; }
.footer-bottom { border-top: 1px solid var(--color-border); padding: 24px 0; text-align: center; color: var(--color-text-subtle); font-size: 0.85em; }


/* ── Mobile Menu Toggle ── */
.menu-toggle {
    display: none;
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    z-index: 10;
    position: relative;
}
.menu-toggle::before { content: none; }
.menu-toggle span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--color-hamburger);
    margin: 5px 0;
    border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
}
.menu-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── Framework Two-Column Layout ── */
.framework-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-bottom: 32px;
}
.framework-left {}
.framework-right {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.framework-right img {
    width: 100%;
    object-fit: cover;
}

.framework-collab-box {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.framework-collab-title {
    font-size: 1.1em;
    font-weight: 700;
    color: var(--color-text);
    margin: 0;
}
.framework-collab-desc {
    font-size: 0.92em;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin: 0;
}
.framework-diagram {
    width: 100%;
}
.framework-core-title {
    font-size: 0.95em;
    font-weight: 600;
    color: var(--color-text);
    margin: 0;
}
.framework-core-svg {
    width: 100%;
}
.framework-approaches-cards {
    display: flex;
    gap: 16px;
}
.framework-approach-svg {
    flex: 1;
    width: 0;
    height: auto;
}
.framework-concepts {
    margin: 20px 0;
}
.framework-concepts-title {
    font-size: 0.85em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--color-text-subtle);
    margin: 0 0 12px;
}

.framework-why {
    margin-top: 24px;
    padding: 20px 24px;
    border-radius: 12px;
    background: var(--color-hover);
    border-left: 3px solid var(--color-accent);
}
.framework-why-title {
    font-size: 0.95em;
    font-weight: 600;
    color: var(--color-text);
    margin: 0 0 8px;
}
.framework-why p {
    font-size: 0.92em;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin: 0;
}

.cognitive-metrics {
    display: flex;
    gap: 16px;
    margin-top: 8px;
}
.cognitive-metrics-label {
    font-size: 0.8em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--color-text-subtle);
    margin-bottom: 8px;
}
.metric-card {
    flex: 1;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--color-border-medium);
    background: var(--color-surface);
    text-align: center;
}
.metric-card .metric-value {
    font-size: 1.6em;
    font-weight: 700;
    color: var(--color-text);
    margin: 0;
}
.metric-card .metric-label {
    font-size: 0.78em;
    color: var(--color-text-subtle);
    margin: 4px 0 0;
}

.use-cases-label {
    font-size: 0.85em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--color-text-subtle);
    margin: 40px 0 16px;
}
.use-cases-grid:last-child {
    margin-bottom: 0;
}
.use-cases-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
}
a.use-case-card { color: inherit; text-decoration: none; }
.use-case-card {
    background: linear-gradient(to right, rgba(210, 194, 255, 0.15), rgba(255, 255, 255, 0));
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
    border: 1px solid var(--color-border);
    padding: 40px;
    gap: 20px;
    height: 296px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
[data-theme="dark"] .use-case-card {
    background: linear-gradient(to right, rgba(147, 69, 225, 0.1), rgba(15, 17, 23, 0));
}
.use-case-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px var(--color-shadow);
}
.use-case-card h4 {
    font-size: 24px;
    font-weight: 500;
    color: var(--color-text);
    margin: 0 0 20px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.use-case-card .use-case-desc {
    font-size: 0.92em;
    color: var(--color-text-subtle);
    line-height: 1.6;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.use-case-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85em;
    color: var(--color-text-subtle);
    margin-top: 20px;
}
.use-case-footer .read-more {
    color: var(--color-accent);
    font-weight: 600;
    font-size: 0.9em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.use-case-footer .read-more:hover {
    color: var(--color-accent-hover);
}
.use-case-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82em;
    color: var(--color-text-subtle);
    margin-top: 12px;
}
.use-case-meta svg {
    vertical-align: -2px;
}
.use-case-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.78em;
    font-weight: 500;
    border: 1px solid var(--color-border-medium);
    color: var(--color-text);
    background: linear-gradient(to right, rgba(210, 194, 255, 0.15) 26%, rgba(255, 255, 255, 0) 88%), rgba(255, 255, 255, 0.40);
    margin-bottom: 12px;
}
[data-theme="dark"] .use-case-tag {
    background: linear-gradient(to right, rgba(210, 194, 255, 0.15) 26%, rgba(255, 255, 255, 0) 88%), rgba(255, 255, 255, 0.06);
}

        .nav-dropdown-sub { margin: 0 0 0 8px; border-left: 2px solid var(--color-border); }
    .nav-dropdown-sub li a { padding: 4px 0 4px 12px; font-size: 0.85em; }
    .nav-dropdown-sub li a:hover { background: none; }

    .page-hero-inner { flex-direction: column; gap: 32px; }

    .page-hero-title h1 { font-size: 2em; }
    .page-hero-image img { height: 280px; max-width: 100%; }

    .pipeline-stepper { padding: 4px; }

    .step-number { font-size: 3.5em; }

    .framework-content { grid-template-columns: 1fr; gap: 24px; }

    .framework-collab-box { gap: 16px; }
    .framework-collab-title { font-size: 1em; }
    .framework-collab-desc { font-size: 0.88em; }
    .framework-approaches-cards { flex-direction: column; gap: 12px; }
    .framework-approach-svg { flex: none; width: 100%; }
    .framework-diagram { max-width: 100%; }

    .framework-why { padding: 16px 20px; }

    .step-desc { font-size: 0.92em; }

    .page-hero-image img { height: 220px; }

    .pipeline-step { padding: 24px 0; }
    .step-number { font-size: 3em; }

// ── Pipeline stepper: scroll-spy + smooth-scroll on click ──
(function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('.pipeline-stepper a[href^="#cf-step-"]'));
    if (!links.length) return;
    var idToLink = {};
    var targets = [];
    links.forEach(function (link) {
        var id = link.getAttribute('href').slice(1);
        var el = document.getElementById(id);
        if (el) { idToLink[id] = link; targets.push(el); }
    });
    if (!targets.length) return;

    function setActive(id) {
        links.forEach(function (a) { a.classList.remove('is-active'); });
        var active = idToLink[id];
        if (active) {
            active.classList.add('is-active');
            try { active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); } catch (e) {}
        }
    }

    if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) setActive(entry.target.id);
            });
        }, { rootMargin: '-30% 0px -55% 0px', threshold: 0 });
        targets.forEach(function (t) { observer.observe(t); });
    }

    links.forEach(function (link) {
        link.addEventListener('click', function (e) {
            var id = link.getAttribute('href').slice(1);
            var el = document.getElementById(id);
            if (!el) return;
            e.preventDefault();
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', '#' + id);
            setActive(id);
        });
    });
})();
