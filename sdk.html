<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Outshift Design — HAX SDK</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script>
(function(){var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t)}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark')}})();
</script>
<style type="text/css">
html { scroll-behavior: smooth; }

:root {
    font-family: Inter, sans-serif;
    font-feature-settings: 'liga' 1, 'calt' 1;    --fancy-transition: 0.25s cubic-bezier(0.78, 0, 0.22, 1);

    --color-bg: #fff;
    --color-text: #293247;
    --color-text-muted: #67707F;
    --color-text-subtle: #59616B;
    --color-border: rgba(41, 50, 71, 0.08);
    --color-border-medium: rgba(41, 50, 71, 0.15);
    --color-surface: rgba(255, 255, 255, 0.97);
    --color-hover: rgba(41, 50, 71, 0.04);
    --color-accent: #00BCEB;
    --color-accent-hover: #187ADC;
    --color-hamburger: #293247;
    --color-shadow: rgba(41, 50, 71, 0.08);
}
@supports (font-variation-settings: normal) {
  :root {
    font-family: InterVariable, sans-serif;
    color: var(--color-text);
  }
}
[data-theme="dark"] {
    --color-bg: #0F1117;
    --color-text: #e0e4ec;
    --color-text-muted: #9ca3af;
    --color-text-subtle: #717a87;
    --color-border: rgba(255, 255, 255, 0.08);
    --color-border-medium: rgba(255, 255, 255, 0.15);
    --color-surface: rgba(15, 17, 23, 0.97);
    --color-hover: rgba(255, 255, 255, 0.06);
    --color-accent: #3fc6ee;
    --color-accent-hover: #00BCEB;
    --color-hamburger: #e0e4ec;
    --color-shadow: rgba(0, 0, 0, 0.3);
}
[data-theme="dark"] .logo-light,
[data-theme="dark"] .footer-logo .logo-light { display: none; }
[data-theme="dark"] .logo-dark,
[data-theme="dark"] .footer-logo .logo-dark { display: block; }
.logo-dark,
.footer-logo .logo-dark { display: none; }

* { box-sizing: border-box; }
.container { width: 100%; padding: 0 10%; box-sizing: border-box; }
body {
    overflow-x: hidden;
    margin: 0;
    padding: 0;
    width: 100%;
    background: var(--color-bg);
    color: var(--color-text);
}
a:link, a:visited, a:hover, a:active {
    text-decoration: none;
    color: var(--color-text);
}

/* ── Doc Header ── */
.doc-header {
    width: 100%;
    border-bottom: 1px solid var(--color-border);
    position: relative;
    z-index: 10;
}
.doc-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 48px;
}
.doc-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.doc-header-left img { height: 40px; }
.doc-header-left .doc-separator {
    width: 1px;
    height: 24px;
    background: var(--color-border-medium);
}
.doc-header-left .doc-title {
    font-size: 1em;
    font-weight: 500;
    color: var(--color-text);
    text-decoration: none;
}
.doc-header-left .doc-title:hover { opacity: 0.7; }
.doc-header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}
.doc-header-right a {
    font-size: 0.9em;
    color: var(--color-text-muted);
    transition: color 0.15s ease;
}
.doc-header-right a:hover { color: var(--color-text); }
.theme-toggle { background: none; border: none; cursor: pointer; padding: 8px; color: var(--color-text); display: flex; align-items: center; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: block; }



/* ── SDK Layout ── */
.sdk-layout {
    display: flex;
    min-height: calc(100vh - 120px);
}
.sdk-sidebar {
    width: 300px;
    min-width: 300px;
    border-right: 1px solid var(--color-border);
    padding: 32px 24px 32px 48px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
}
.sdk-sidebar-section { margin-bottom: 24px; }
.sdk-sidebar-title {
    font-size: 0.85em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-text-muted);
    margin: 0 0 10px;
    padding: 8px 0;
}
.sdk-sidebar-link {
    display: block;
    padding: 7px 12px;
    font-size: 0.95em;
    color: var(--color-text-muted);
    border-radius: 6px;
    transition: all 0.15s ease;
}
.sdk-sidebar-link:hover {
    background: var(--color-hover);
    color: var(--color-text);
}
.sdk-sidebar-link.is-active {
    background: rgba(0, 188, 235, 0.1);
    color: var(--color-accent);
    font-weight: 500;
}

.sdk-main {
    flex: 1;
    padding: 48px 10% 80px 48px;
    max-width: calc(100% - 300px);
}

.sdk-main h1 {
    font-size: 2.4em;
    font-weight: 200;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
}
.sdk-main > p {
    font-size: 1.05em;
    line-height: 1.7;
    color: var(--color-text-muted);
    margin: 0 0 16px;
    max-width: 720px;
}

.sdk-github-btn {
    display: inline-block;
    background: var(--color-accent);
    color: #fff !important;
    padding: 10px 24px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 0.95em;
    margin: 16px 0 48px;
    transition: background 0.2s ease;
}
.sdk-github-btn:hover { background: var(--color-accent-hover); }
/* Bright cyan + white fails WCAG in dark mode; use ink on accent instead */
[data-theme="dark"] .sdk-github-btn {
    color: #0a1016 !important;
}
[data-theme="dark"] .sdk-github-btn:hover {
    color: #0a1016 !important;
}

.sdk-main h2 {
    font-size: 1.8em;
    font-weight: 300;
    margin: 0 0 32px;
}

/* ── Component Cards ── */
.components-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
}
.component-card {
    display: block;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--color-surface);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
    text-decoration: none;
    color: inherit;
}
.component-card:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
}
.component-card:hover {
    border-color: var(--color-border-medium);
    box-shadow: 0 4px 24px var(--color-shadow);
}
.component-card-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: var(--color-hover);
    display: flex;
    align-items: center;
    justify-content: center;
}
.component-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.component-card-body {
    padding: 16px 20px 20px;
}
.component-card-body h3 {
    font-size: 1.1em;
    font-weight: 600;
    margin: 0 0 6px;
}
.component-card-body p {
    font-size: 0.85em;
    color: var(--color-text-muted);
    line-height: 1.5;
    margin: 0;
}

/* ── Footer ── */
.doc-footer {
    border-top: 1px solid var(--color-border);
    padding: 20px 48px;
    font-size: 0.8em;
    color: var(--color-text-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.doc-footer a { color: var(--color-text-muted); }
.doc-footer a:hover { color: var(--color-text); }

/* ── Responsive ── */
@media (max-width: 1024px) {
    .components-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
    .doc-header-inner { padding: 12px 20px; }
    .doc-header-right a.doc-back-link { display: none; }

    .sdk-layout { flex-direction: column; }
    .sdk-sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        padding: 24px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 32px;
    }
    .sdk-sidebar-section { margin-bottom: 0; }
    .sdk-main {
        max-width: 100%;
        padding: 32px 20px;
    }
    .components-grid { grid-template-columns: 1fr; }
    .doc-footer { padding: 16px 20px; flex-direction: column; gap: 8px; text-align: center; }
})();
</script>
<script src="assistant.js"></script>
</body>
</html>
