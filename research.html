<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Outshift Design — Research</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script>
(function(){var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t)}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark')}})();
</script>
<style type="text/css">
html { scroll-behavior: smooth; }

:root {
    font-family: Inter, sans-serif;
    font-feature-settings: 'liga' 1, 'calt' 1;    --fancy-transition: 0.25s cubic-bezier(0.78, 0, 0.22, 1);

    --color-bg: #fff;
    --color-text: #293247;
    --color-text-muted: #67707F;
    --color-text-subtle: #59616B;
    --color-border: rgba(41, 50, 71, 0.08);
    --color-border-medium: rgba(41, 50, 71, 0.15);
    --color-surface: rgba(255, 255, 255, 0.97);
    --color-hover: rgba(41, 50, 71, 0.04);
    --color-accent: #00BCEB;
    --color-accent-hover: #187ADC;
    --color-tag-bg: rgba(0, 188, 235, 0.1);
    --color-tag-border: rgba(0, 188, 235, 0.2);
    --color-tag-text: #187ADC;
    --color-hamburger: #293247;
    --color-shadow: rgba(41, 50, 71, 0.08);
    --color-research-card-bg: rgba(210, 194, 255, 0.06);
}
@supports (font-variation-settings: normal) {
  :root {
    font-family: InterVariable, sans-serif;
    color: var(--color-text);
  }
}

[data-theme="dark"] {
    --color-bg: #0f1117;
    --color-text: #e0e4ec;
    --color-text-muted: #9ca3b0;
    --color-text-subtle: #8a919c;
    --color-border: rgba(255, 255, 255, 0.08);
    --color-border-medium: rgba(255, 255, 255, 0.15);
    --color-surface: rgba(15, 17, 23, 0.97);
    --color-hover: rgba(255, 255, 255, 0.06);
    --color-accent: #3fc6ee;
    --color-accent-hover: #00BCEB;
    --color-tag-bg: rgba(0, 188, 235, 0.12);
    --color-tag-border: rgba(0, 188, 235, 0.25);
    --color-tag-text: #3fc6ee;
    --color-hamburger: #e0e4ec;
    --color-shadow: rgba(0, 0, 0, 0.3);
    --color-research-card-bg: rgba(147, 69, 225, 0.06);
}
[data-theme="dark"] .logo-light,
[data-theme="dark"] .footer-logo .logo-light { display: none; }
[data-theme="dark"] .logo-dark,
[data-theme="dark"] .footer-logo .logo-dark { display: block; }
.logo-dark,
.footer-logo .logo-dark { display: none; }
img.img-dark { display: none !important; }
[data-theme="dark"] img.img-light { display: none !important; }
[data-theme="dark"] img.img-dark { display: block !important; }

.theme-toggle {
    display: inline-flex;
    padding: 6px;
    border-radius: 8px;
    background: none;
    border: none;
    color: var(--color-text);
    cursor: pointer;
    transition: background 0.2s;
    flex-direction: row;
    z-index: 0;
}
.theme-toggle::before { content: none; }
.theme-toggle:hover { background: var(--color-hover); }
.theme-toggle .icon-sun { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

* { box-sizing: border-box; }
.container {
    width: 100%;
    padding: 0 10%;
    box-sizing: border-box;
}
body {
    overflow-x: hidden;
    margin: 0;
    padding: 0;
    width: 100%;
    background: var(--color-bg);
    color: var(--color-text);
}

/* ── Header ── */
header {
    padding: 1% 0;
    width: 100%;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    position: relative;
    z-index: 10;
}
.design {
    font-size: 1.8em;
    font-weight: 200;
    margin-left: 8px;
}
.logo {
    align-items: center;
}
.logo, nav ul, header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
nav ul {
    list-style: none;
    gap: 30px;
}
nav > ul > li { position: relative; }
.text, .icon {
    display: inline-block;
    vertical-align: middle;
}
.icon { margin-top: 2px; }
.has-dropdown { position: relative; }
.nav-dropdown {
    position: absolute;
    top: calc(100% + 0.5rem);
    left: 0;
    z-index: 20;
    min-width: 200px;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: scaleY(0);
    transform-origin: top;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    box-shadow: 0 6px 24px var(--color-shadow);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
}
.has-dropdown.is-active > .nav-dropdown {
    opacity: 1;
    visibility: visible;
    transform: scaleY(1);
}
.nav-dropdown.nav-dropdown--research {
    left: auto;
    right: 0;
    transform-origin: top right;
}

.nav-dropdown > li {
    display: block;
    width: 100%;
}
.nav-dropdown > li > a {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 20px;
    color: var(--color-text-muted);
    font-size: 0.9em;
    white-space: nowrap;
    transition: background 0.2s;
}
.nav-dropdown > li > a:hover {
    background: var(--color-hover);
    color: var(--color-text) !important;
}
.nav-dropdown-group {
    padding: 0;
}
.nav-dropdown-label {
    display: flex;
    align-items: center;
        padding: 10px 20px;
    font-size: 0.95em;
    font-weight: 400;
    color: var(--color-text);
    text-decoration: none;
    transition: background 0.2s;
    white-space: nowrap;
}
.nav-dropdown-label:hover {
    background: var(--color-hover);
}
.nav-dropdown-sub {
    list-style: none;
    padding: 0;
    margin: 0 12px 8px 20px;
    display: flex;
    flex-direction: column;
    gap: 0;
    border-left: 2px solid var(--color-border);
}
.nav-dropdown-sub li {
    display: block;
    width: 100%;
}
.nav-dropdown-sub li a {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 16px;
    color: var(--color-text-muted);
    font-size: 0.85em;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.nav-dropdown-sub li a:hover {
    background: var(--color-hover);
    color: var(--color-text) !important;
}
.external-link-icon {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-left: 4px;
    vertical-align: middle;
    opacity: 0.5;
}
a:link, a:visited, a:hover, a:active {
    text-decoration: none;
    color: var(--color-text);
}
h1 { font-size: 2.5em; font-weight: 200; margin: 5px 0; }
h2 { font-size: 2.5em; font-weight: 600; margin: 5px 0; }
h3 { font-size: 1.8em; font-weight: 200; margin: 3% 0; }
h5 { font-size: 1.5em; font-weight: 200; margin: 4% 0; line-height: 1.6em; }
h6 { font-size: 0.8em; font-weight: 600; text-transform: uppercase; letter-spacing: 1.8px; margin: 5px 0; color: var(--color-text-subtle); }
button {
    position: relative;
    display: flex;
    padding: 18px 24px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border-radius: 40px;
    font-size: 1.2em;
    background: transparent;
    color: var(--color-text);
    border: none;
    cursor: pointer;
    z-index: 0;
}
button::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 40px;
    padding: 1.5px;
    background: linear-gradient(294deg, #9345E1, #187ADC, #00BCEB, #74BF4B, #F5B35C, #F09256, #EB7251);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

/* ── Blobs ── */
.blob {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: contain;
    background-repeat: no-repeat;
    opacity: 1;
}
.blob-1 {
    background-image: url('images/round-violet.svg');
    top: -10%;
    left: 10%;
    animation: move1 10s infinite alternate ease-in-out;
}
.blob-2 {
    background-image: url('images/round-orange.svg');
    top: 20%;
    right: 10%;
    animation: move2 15s infinite alternate ease-in-out;
}
.blob-3 {
    background-image: url('images/round-blue.svg');
    bottom: 10%;
    left: 30%;
    animation: move3 8s infinite alternate ease-in-out;
}
@keyframes move1 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(20%, 50%) scale(1.1); }
}
@keyframes move2 {
    from { transform: translate(0, 0) rotate(0deg); }
    to { transform: translate(-30%, 30%) rotate(90deg); }
}
@keyframes move3 {
    from { transform: translate(0, 0); }
    to { transform: translate(50%, -30%); }
}
.blobs-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
}

/* ── Research Hero ── */
.research-hero {
    position: relative;
    z-index: 1;
    padding: 24px 0 64px;
}
.research-hero .breadcrumb {
    font-size: 0.85em;
    color: var(--color-text-subtle);
    margin-bottom: 32px;
}
.research-hero .breadcrumb a {
    color: var(--color-accent);
    text-decoration: none;
}
.research-hero .breadcrumb span {
    margin: 0 8px;
    color: var(--color-border-medium);
}
.research-hero-title {
    text-align: center;
    margin-bottom: 32px;
}
.research-hero-title h1 {
    font-size: 2em;
    font-weight: 600;
    margin: 0;
    line-height: 1.15;
}
.research-hero-inner {
    display: flex;
    align-items: center;
    gap: 0;
}
.research-hero-text {
    flex: 5;
    padding-right: 40px;
}
.research-hero-text p {
    font-size: 18px;
    font-weight: 300;
    color: #363E4A;
    line-height: 1.7;
    margin: 0;
}
[data-theme="dark"] .research-hero-text p {
    color: var(--color-text-muted);
}
.research-hero-image {
    flex: 7;
}
.research-hero-image img {
    width: 100%;
    height: 380px;
    border-radius: 16px;
    object-fit: cover;
    display: block;
}

/* ── Research Section Title ── */
.research-section-header {
    text-align: center;
    padding: 60px 0 48px;
    position: relative;
    z-index: 1;
}
.research-section-header h2 {
    font-size: 2em;
    font-weight: 200;
    margin: 0 0 16px;
}
.research-section-header p {
    font-size: 1.05em;
    color: var(--color-text-muted);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
}

/* ── Research Cards (Alternating) ── */
.research-cards {
    position: relative;
    z-index: 1;
    padding: 0 0 40px;
}
.research-card {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 32px;
    position: relative;
    width: 58.333%;
    margin: 0 0 40px;
    border-radius: 20px;
    z-index: 0;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
}
.research-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 1.5px;
    background: linear-gradient(to right, rgba(77, 99, 128, 0.21), #2268BE);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}
.research-card.research-card--right {
    margin-left: auto;
}
.research-card-image {
    flex: 0 0 200px;
    position: relative;
    overflow: hidden;
}
.research-card-image img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    display: block;
}
.research-card-text {
    flex: 1;
}
.research-card-text h3 {
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 12px;
    color: var(--color-text);
}
.research-card-text p {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin: 0 0 16px;
}
.read-more {
    color: #1BCDFF;
    font-weight: 600;
    font-size: 0.9em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.read-more:hover {
    color: var(--color-accent-hover) !important;
}


/* ── Footer ── */
footer {
    position: relative;
    z-index: 1;
    background: var(--color-bg);
    padding: 60px 0 0;
}
.footer-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 40px;
}
.footer-logo img { height: 60px; }
.footer-links h6 {
    font-size: 0.8em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--color-text);
    margin: 0 0 16px;
}
.footer-links a {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--color-text-subtle);
    font-size: 0.95em;
    margin-bottom: 10px;
}
.footer-links a svg { width: 14px; height: 14px; }
.footer-links a:hover { color: var(--color-text); }
.footer-social h6 {
    font-size: 0.8em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--color-text);
    margin: 0 0 16px;
}
.footer-social-icons {
    display: flex;
    gap: 10px;
}
.footer-social-icons a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--color-border);
    color: var(--color-text-subtle);
    transition: background 0.2s, color 0.2s;
}
.footer-social-icons a:hover {
    background: var(--color-hover);
    color: var(--color-text);
}
.footer-social-icons a svg { width: 18px; height: 18px; }
.footer-bottom {
    border-top: 1px solid var(--color-border);
    padding: 24px 0;
    text-align: center;
    color: var(--color-text-subtle);
    font-size: 0.85em;
}

/* ── Card Hover ── */
.research-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.research-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 32px rgba(34, 104, 190, 0.10);
}
.research-card-image img {
    transition: transform 0.4s ease;
}
.research-card:hover .research-card-image img {
    transform: scale(1.05);
}


/* ── Mobile Menu Toggle ── */
.menu-toggle {
    display: none;
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    z-index: 10;
    position: relative;
}
.menu-toggle::before { content: none; }
.menu-toggle span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--color-hamburger);
    margin: 5px 0;
    border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
}
.menu-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── Responsive: Tablet ── */
@media (max-width: 1024px) {
    .research-hero-title h1 { font-size: 2em; }
    .research-hero-image img { height: 340px; }
    .research-section-header h2 { font-size: 2.2em; }
    .research-card { width: 70%; padding: 28px; }
    .research-card-image { flex: 0 0 160px; }
    .research-card-image img { width: 160px; height: 160px; }
}

/* ── Responsive: Mobile ── */
@media (max-width: 768px) {
    .menu-toggle {
        display: block;
    }
    header nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 70%;
        max-width: 300px;
        height: 100vh;
        background: var(--color-surface);
        backdrop-filter: blur(20px);
        z-index: 9;
        transition: right 0.35s ease;
        padding: 72px 20px 32px;
        box-shadow: -4px 0 24px rgba(0, 0, 0, 0.08);
        overflow-y: auto;
    }
    header nav.open {
        right: 0;
    }
    header nav ul {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 0;
        margin: 0;
        width: 100%;
    }
    header nav ul li {
        width: 100%;
        padding: 12px 0;
        border-bottom: 1px solid var(--color-border);
    }
    header nav ul li a {
        font-size: 0.95em;
        text-align: left;
        display: block;
        width: 100%;
    }
    .has-dropdown > a .icon { transition: transform 0.25s; }
    .has-dropdown.is-active > a .icon { transform: rotate(180deg); }
    .nav-dropdown {
        position: static;
        transform: scaleY(1);
        opacity: 1;
        visibility: visible;
        display: none;
        min-width: 0;
        background: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 4px 0 0 12px;
        overflow: visible;
    }
    .has-dropdown.is-active > .nav-dropdown { display: block; }
    .nav-dropdown li a { padding: 6px 0; font-size: 0.88em; }
    .nav-dropdown li a:hover { background: none; }
    .nav-dropdown-label { padding: 6px 0 4px; font-size: 0.92em; }
        .nav-dropdown-sub { margin: 0 0 0 8px; border-left: 2px solid var(--color-border); }
    .nav-dropdown-sub li a { padding: 4px 0 4px 12px; font-size: 0.85em; }
    .nav-dropdown-sub li a:hover { background: none; }

    .research-hero-inner {
        flex-direction: column;
        gap: 32px;
    }
    .research-hero-text { padding-right: 0; }
    .research-hero-title h1 { font-size: 2em; }
    .research-hero-image img { height: 280px; max-width: 100%; }

    .research-section-header h2 { font-size: 1.8em; }

    .research-card {
        width: 100%;
        flex-direction: column !important;
        gap: 24px;
        padding: 28px;
        margin-bottom: 24px;
    }
    .research-card.research-card--right {
        margin-left: 0;
    }
    .research-card-image {
        flex: none;
        display: flex;
        justify-content: center;
    }
    .research-card-image img {
        width: 160px;
        height: 160px;
    }
    .research-card-text {
        text-align: center;
    }
    .research-card-text .read-more {
        justify-content: center;
    }

    .footer-top {
        flex-direction: column;
        gap: 32px;
    }
}

@media (max-width: 480px) {
    .research-hero-title h1 { font-size: 1.6em; }
    .research-hero-image img { height: 220px; }
    .research-section-header h2 { font-size: 1.5em; }
    .research-card-image img { width: 160px; height: 160px; }
    footer { padding: 40px 0 0; }
    .footer-logo img { height: 48px; }
}

/* === Hero Scroll Arrow === */
.hero-scroll-arrow {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    color: rgba(255,255,255,0.65);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s, transform 0.2s;
    z-index: 10;
}
.hero-scroll-arrow:hover {
    color: #fff;
    transform: translateX(-50%) translateY(4px);
}
.hero-scroll-arrow svg {
    width: 28px;
    height: 28px;
    display: block;
}
})();
</script>
<script src="assistant.js"></script>
</body>
</html>
